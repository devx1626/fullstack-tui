name: CI

# The merge bar from tui-overhaul-spec.md §13: lint + build + tests green.
# Three stages because they fail for different reasons — `lint` is pure static
# analysis (no bundle needed), `test:unit` is fast feedback on the code, and
# `check` grades every reference solution against the curriculum (and takes
# minutes because the Python checks spawn real interpreters). They run in that
# order — `self-check` needs `unit` — so a broken build fails at the cheap gate
# and never starts the long one.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + build + unit tests
    runs-on: ubuntu-latest
    # Hard budgets, not estimates: a hung run should die and mark red long
    # before GitHub's 6-hour default. Both jobs clear their local timings
    # (unit ~5 min, self-check ~8 min) with several runners' worth of slack.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint first: it needs no bundle, so a style/static-analysis break fails
      # before any build or test minutes are spent. Blocking since P1-5 (the
      # one-time cleanup pass shipped with the config; baseline is 0 errors).
      - run: npm run lint
      # The classic UI runs from source; the Ink tree needs a bundle, and the
      # render tests need the harness bundle (they skip without it).
      - run: npm run build
      # CI=0 mirrors is-in-ci's truthiness rule, so ink (imported by render
      # tests) always picks its streaming frame mode even on this runner.
      # Belt and braces: the suites also self-neutralize via
      # tests/helpers/runner-env.js, but a new test that renders ink without
      # that import must not depend on remembering why its frame is empty.
      - run: npm run test:unit
        env:
          CI: 0

  self-check:
    name: curriculum + editor self-check
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # CI=0 for the same reason as the unit job: §9 of check.js reads frames
      # streamed from ink against a fake stdout (it also clears CI itself
      # around the harness import; this keeps any future section safe).
      - run: npm run check
        env:
          CI: 0
